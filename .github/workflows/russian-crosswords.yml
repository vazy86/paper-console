name: Russian crosswords
on:
  pull_request:
  push:
    branches: [main, feat/russian-crosswords]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest testing/test_crossword.py testing/test_crossword_ru.py testing/test_printer_transport.py -q
      - run: python testing/render_russian_crossword.py --output testing/artifacts/debug/crossword_ru.png
      - uses: actions/upload-artifact@v4
        with:
          name: russian-crossword-preview
          path: testing/artifacts/debug/crossword_ru.png
